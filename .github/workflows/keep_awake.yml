name: Keep Render Awake

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping request to Render backend
        run: |
          curl -s https://socialnetwork-rkjz.onrender.com/ || echo "Ping failed"
